# Add these blocks inside the existing `server { ... }` for the MOTM site.

# Lead endpoint -> Node.js service
location /api/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    client_max_body_size 32k;
    proxy_read_timeout 45s;
}

# Never serve backend files if the server/ folder was uploaded with the site
location ^~ /server/ {
    deny all;
    return 404;
}
